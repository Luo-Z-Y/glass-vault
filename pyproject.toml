[project]
name = "glassvault"
version = "0.1.0"
description = "Zero-trust conversational transaction agent (DBS DCTA track, Tencent Cloud Hackathon Singapore 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.20.0",
    "pydantic>=2.11",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
