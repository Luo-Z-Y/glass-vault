[project]
name = "glassvault"
version = "0.1.0"
description = "Zero-trust conversational transaction agent (DBS DCTA track, Tencent Cloud Hackathon Singapore 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "pydantic>=2.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
