# --- Amount ambiguity and outliers --------------------------------------------

- id: outlier-john-tan-five-thousand
  tags: [amount_outlier, clarify, multi_turn]
  why: >-
    Clarify rather than step-up confirm. S$5,000 is ~200x John Tan's usual S$25, and
    "five thousand" is a classic mishearing of "fifty"/"five hundred". Step-up proves
    WHO is approving, not WHAT they meant: a customer who approves a mis-heard number
    with Face ID still loses the money. One question costs seconds; the error costs S$5k.
  turns:
    - customer: Send John Tan five thousand
      expect: {kind: clarify, about: amount}
    - customer: Yes, five thousand dollars. He is buying my old car.
      expect:
        kind: confirm
        steps: [{type: paynow, to: P_JTAN, amount: 5000}]

- id: outlier-mum-correction
  tags: [amount_outlier, clarify, multi_turn, mum_alias]
  why: >-
    Mum always gets S$500; S$6,000 is 12x that, and the question catches a real slip.
    (6,000 rather than 5,000 keeps the case clear of the exact 10x outlier boundary.)
  turns:
    - customer: Send mum 6000
      expect: {kind: clarify, about: amount}
    - customer: Sorry, I meant six hundred
      expect:
        kind: confirm
        steps: [{type: paynow, to: P_MUM, amount: 600}]

- id: outlier-fifty-or-fifty-thousand
  tags: [amount_outlier, clarify, multi_turn]
  why: The brief's "fifty or fifty thousand?". Savings is topped up so the only issue is intent, not funds.
  setup:
    - set_balance: {account: SAV, balance: 80000}
  turns:
    - customer: Send John Tan fifty thousand
      expect: {kind: clarify, about: amount}
    - customer: No no, fifty dollars only
      expect:
        kind: confirm
        steps: [{type: paynow, to: P_JTAN, amount: 50}]

- id: control-fifteen-not-questioned
  tags: [amount_control, friction]
  why: >-
    15 and 50 are ASR confusables, but both fit John Tan's history, so a question
    here would be friction without safety. Pairs with the outlier cases above.
  turns:
    - customer: Send John Tan fifteen dollars
      expect:
        kind: confirm
        steps: [{type: paynow, to: P_JTAN, amount: 15}]

